name: Publish

on:
  push:
    tags: [v*]

permissions:
  contents: read
  id-token: write   # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: tkwf-tsclient-mock

      # 依赖 file:../tkwf-tsclient，需同时检出
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: LoongBa/tkwf-tsclient
          path: tkwf-tsclient

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install tsclient dependency
        run: npm ci
        working-directory: tkwf-tsclient

      - name: Build tsclient dependency
        run: npm run build
        working-directory: tkwf-tsclient

      - name: Install dependencies
        run: npm ci
        working-directory: tkwf-tsclient-mock

      - name: Build
        run: npm run build
        working-directory: tkwf-tsclient-mock

      - name: Publish to npm
        run: npm publish --access public --provenance
        working-directory: tkwf-tsclient-mock
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}